<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">CMX: Less repetition. More room to code.</title>
  <desc id="desc">Compressius Maximus. A charcoal and crimson graphic showing repeated context reduced to a smaller summary, with recent context preserved. Illustration, not a benchmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17171e"/><stop offset="1" stop-color="#08080c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e63250"/><stop offset="1" stop-color="#a80d2b"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <path d="M20 0H1260Q1280 0 1280 20V6H0V20Q0 0 20 0" fill="#c81e3c"/>
  <circle cx="1130" cy="170" r="220" fill="#c81e3c" opacity=".06"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="131" fill="#f8f6f7" font-size="96" font-weight="900" letter-spacing="-6">CMX<tspan fill="#e63250">.</tspan></text>
    <text x="60" y="162" fill="#b7b4c0" font-size="14" font-weight="700" letter-spacing="3.6">COMPRESSIUS MAXIMUS</text>
    <text x="56" y="241" fill="#f8f6f7" font-size="45" font-weight="700" letter-spacing="-1.4">Less repetition.</text>
    <text x="56" y="295" fill="#f8f6f7" font-size="45" font-weight="700" letter-spacing="-1.4">More room to code.</text>
    <text x="60" y="365" fill="#b7b4c0" font-size="16">Local AI context compression for coding agents</text>
    <path d="M654 60V360" stroke="#34313c"/>
    <text x="706" y="79" fill="#b7b4c0" font-size="12" font-weight="700" letter-spacing="2">REPEATED CONTEXT</text>
    <text x="1043" y="79" fill="#b7b4c0" font-size="12" font-weight="700" letter-spacing="2">AFTER CMX</text>
    <g fill="#3e2430" stroke="#743044">
      <rect x="706" y="105" width="206" height="29" rx="5"/><rect x="706" y="144" width="206" height="29" rx="5"/>
      <rect x="706" y="183" width="206" height="29" rx="5"/><rect x="706" y="222" width="206" height="29" rx="5"/>
    </g>
    <g stroke="#b9576d" stroke-width="3" opacity=".6">
      <path d="M722 119H848M722 158H871M722 197H832M722 236H856"/>
    </g>
    <path d="M938 177H1013M997 164L1013 177L997 190" fill="none" stroke="#e63250" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1043" y="145" width="177" height="66" rx="8" fill="url(#accent)"/>
    <text x="1131" y="171" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">SUMMARY</text>
    <text x="1131" y="197" text-anchor="middle" fill="#ffe0e6" font-size="12">eligible older context</text>
    <rect x="706" y="267" width="206" height="51" rx="5" fill="#252833" stroke="#565968"/>
    <rect x="1043" y="267" width="177" height="51" rx="5" fill="#252833" stroke="#565968"/>
    <text x="809" y="298" text-anchor="middle" fill="#e5e5ec" font-size="13">Recent context</text>
    <text x="1131" y="298" text-anchor="middle" fill="#e5e5ec" font-size="13">Recent context</text>
    <text x="706" y="365" fill="#8f8b9c" font-size="12">SCHEMATIC · COMPRESSION DEPENDS ON THE REQUEST</text>
